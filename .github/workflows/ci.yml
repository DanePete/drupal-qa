name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # The README's install file is linted as a real caller.
          mkdir -p "$RUNNER_TEMP/caller/.github/workflows"
          cp examples/drupal-qa.yml "$RUNNER_TEMP/caller/.github/workflows/"
          ./actionlint -color .github/workflows/*.yml "$RUNNER_TEMP/caller/.github/workflows/drupal-qa.yml"
      - name: composer validate
        run: composer validate --strict --no-check-lock

  setup:
    name: Setup wizard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install expect and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect shellcheck > /dev/null
      - name: shellcheck
        run: shellcheck -s bash -S warning bin/drupal-qa-setup tests/setup/run.sh tests/setup/fakebin/*
      - name: Scenarios
        run: bash tests/setup/run.sh
